# Plain HTTP static origin for the OwlShelf PWA.
#
# TLS is terminated by Cloudflare Tunnel running on the HOST. This container
# joins the host network namespace, so binding 127.0.0.1 means ONLY host-local
# cloudflared can reach it — there is no published port and no other network
# path to this origin. There is intentionally no `listen 443`, no
# ssl_certificate, and no redirect to HTTPS: CF already owns TLS.

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the app uses internal state, not client-side routes, but a
    # reload of any deep link must still land on index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must never be cached by the browser or by an
    # intermediary: a stale SW serving old bundles is the plan's §12.14 defect.
    # Registration/update logic is owned by src/lib/pwa.ts.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Hashed Vite assets can be cached hard; index.html and the manifest cannot.
    # Quoted: nginx treats an unquoted `}` in {8,} as the end of the block.
    location ~* "\.[0-9a-f]{8,}\.(js|css|png|svg|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
    }

    # The relay is a different service in the same pod. Never proxy /ws here:
    # cloudflared routes it to the relay directly (DEPLOYMENT.md §3).
    location /ws {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # CF supplies these at the edge; setting them here is harmless and keeps the
    # origin correct if it is ever reached directly for debugging.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
